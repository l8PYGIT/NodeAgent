<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="100%">
  <defs>
    <linearGradient id="aBannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121e" />
      <stop offset="50%" stop-color="#0b1b2b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="aBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="aGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <filter id="aGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="940" height="260" rx="16" fill="url(#aBannerBg)" />
  <rect width="940" height="260" rx="16" fill="none" stroke="#1e3a5f" stroke-width="1.5" />

  <!-- Ambient Glow Behind Logo -->
  <circle cx="160" cy="130" r="100" fill="url(#aGlowGrad)" filter="url(#aGlow)" />
  <circle cx="820" cy="80" r="120" fill="url(#aGlowGrad)" filter="url(#aGlow)" />

  <!-- Grid decoration lines -->
  <g stroke="#162c46" stroke-width="0.8" opacity="0.6">
    <line x1="40" y1="60" x2="900" y2="60" />
    <line x1="40" y1="130" x2="900" y2="130" />
    <line x1="40" y1="200" x2="900" y2="200" />
  </g>

  <!-- NodeAgent Logo Symbol (Server Node with Core Lightning) -->
  <g transform="translate(80, 50)">
    <!-- Server Stack Box -->
    <rect x="25" y="15" width="110" height="130" rx="12" fill="#0d2137" stroke="url(#aBrandGrad)" stroke-width="3" />
    
    <!-- Rack Server Slots -->
    <rect x="37" y="32" width="86" height="20" rx="4" fill="#081524" stroke="#1e3a5f" stroke-width="1.2" />
    <circle cx="48" cy="42" r="3.5" fill="#22c55e" />
    <line x1="62" y1="42" x2="110" y2="42" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" />

    <rect x="37" y="60" width="86" height="20" rx="4" fill="#081524" stroke="#1e3a5f" stroke-width="1.2" />
    <circle cx="48" cy="70" r="3.5" fill="#38bdf8" />
    <line x1="62" y1="70" x2="100" y2="70" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />

    <rect x="37" y="88" width="86" height="20" rx="4" fill="#081524" stroke="#1e3a5f" stroke-width="1.2" />
    <circle cx="48" cy="98" r="3.5" fill="#a855f7" />
    <line x1="62" y1="98" x2="114" y2="98" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />

    <rect x="37" y="116" width="86" height="16" rx="4" fill="#081524" stroke="#1e3a5f" stroke-width="1.2" />
    <circle cx="48" cy="124" r="3" fill="#eab308" />
    <line x1="62" y1="124" x2="90" y2="124" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Typography & Content -->
  <g transform="translate(280, 55)">
    <!-- Brand Title -->
    <text x="0" y="42" fill="#ffffff" font-size="38" font-weight="800" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="-0.5">
      Node<tspan fill="url(#aBrandGrad)">Agent</tspan>
    </text>
    
    <!-- Badges Row -->
    <g transform="translate(225, 14)">
      <rect x="0" y="0" width="84" height="24" rx="6" fill="#0d2137" stroke="#1e3a5f" />
      <text x="42" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">v0.6.0 RELEASE</text>

      <rect x="94" y="0" width="112" height="24" rx="6" fill="#0d2137" stroke="#1e3a5f" />
      <text x="150" y="16" fill="#06b6d4" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">SNI 443 ROUTER</text>
    </g>

    <!-- Tagline -->
    <text x="0" y="80" fill="#cbd5e1" font-size="15" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
      High-Performance Multi-Tenant &amp; Dedicated Xray Engine
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="142" height="28" rx="14" fill="#0d2137" stroke="#1e3a5f" />
      <circle cx="14" cy="14" r="4" fill="#06b6d4" />
      <text x="26" y="18" fill="#94a3b8" font-size="11.5" font-weight="500" font-family="system-ui, sans-serif">Port 443 SNI Router</text>

      <rect x="152" y="0" width="154" height="28" rx="14" fill="#0d2137" stroke="#1e3a5f" />
      <circle cx="166" cy="14" r="4" fill="#8b5cf6" />
      <text x="178" y="18" fill="#94a3b8" font-size="11.5" font-weight="500" font-family="system-ui, sans-serif">Dedicated Ports (11000+)</text>

      <rect x="316" y="0" width="124" height="28" rx="14" fill="#0d2137" stroke="#1e3a5f" />
      <circle cx="330" cy="14" r="4" fill="#22c55e" />
      <text x="342" y="18" fill="#94a3b8" font-size="11.5" font-weight="500" font-family="system-ui, sans-serif">Hard Limits Guard</text>

      <rect x="450" y="0" width="120" height="28" rx="14" fill="#0d2137" stroke="#1e3a5f" />
      <circle cx="464" cy="14" r="4" fill="#38bdf8" />
      <text x="476" y="18" fill="#94a3b8" font-size="11.5" font-weight="500" font-family="system-ui, sans-serif">bbolt Persistence</text>
    </g>
  </g>
</svg>
